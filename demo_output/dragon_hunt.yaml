  lines:
  - type: action
    content: '无星无月，万籁俱寂。山谷间只有溪水潺潺的声音。


      火堆旁，少女抱着膝盖，望着跳跃的火焰发呆。'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 睡不着？
    character: null
    parenthetical: null
    confidence: 0.0
  - type: action
    content: '老猎人往火里添了根柴，火星噼啪溅起。


      少女摇摇头：'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 爷爷，世界上真的有龙吗？
    character: 石像
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 老猎人沉默了很久。火光照着他布满皱纹的脸，像是刀刻的石像。最后他说：
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 有没有龙不重要。重要的是——你心里有没有那条你想成为的龙。
    character: 石像
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 少女愣住了。她低下头，看着自己手心那道还未愈合的伤痕，那是白天在山涧里摔的。
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 明天，我还要上山。
    character: 那道
    parenthetical: null
    confidence: 0.5
  - type: action
    content: '她说。


      老猎人没有回答，只是从怀里摸出一块干粮递给她。'
    character: null
    parenthetical: null
    confidence: 1.0
