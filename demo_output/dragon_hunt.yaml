  - type: action
    content: '黎明前的山谷是最冷的。火堆燃尽时，天边终于泛起了鱼肚白。少女背起竹篓，踏上了通往山顶那条碎石小路。她的背影瘦小而倔强，在山岚中渐渐模糊。


      老猎人望着那个方向，久久没有移开目光。'
    character: null
    parenthetical: null
