  lines:
  - type: action
    content: '碎石小路的尽头，是一块突兀的巨石。


      少女爬上去的时候，太阳刚刚跃出云海。整片天空被染成了橘红色，层峦叠嶂在脚下铺展开来，像是大地的脊背。


      她从竹篓里取出一卷残破的羊皮纸，对着日出的方向展开。羊皮纸上画着潦草的地图，终点的标记处写着四个字：龙眠之地。'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 龙眠之地……
    character: 羊皮纸
    parenthetical: null
    confidence: 0.5
  - type: action
    content: '少女喃喃自语，手指沿着地图上的虚线移动。


      身后传来脚步声。


      少女猛然回头——一只通体雪白的狐狸正蹲在巨石边缘，歪着头看她。狐狸的眼睛是金色的，瞳孔竖成一条线。


      少女愣住了：'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 你……从哪里来的？
    character: 金色
    parenthetical: null
    confidence: 0.5
  - type: action
    content: '狐狸没有动，只是轻轻甩了甩蓬松的尾巴。阳光穿过它的毛发，在石面上投下一层柔和的光晕。


      少女慢慢蹲下来，伸出一只手。'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 别怕。
    character: 步子
    parenthetical: null
    confidence: 0.5
  - type: action
    content: '狐狸盯着她的手指看了一会儿，然后迈着优雅的步子走过来，用鼻子碰了碰她的指尖。


      那一瞬间，少女感到一阵奇特的力量通过指尖传遍全身。羊皮纸上那个'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 龙眠之地
    character: 羊皮纸
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 的标记，开始泛起微微的金光。
    character: null
    parenthetical: null
    confidence: 1.0
