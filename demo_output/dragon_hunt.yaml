  location: 群峰之间的湖泊
  time_of_day: UNKNOWN
  location_note: null
  lines:
  - type: action
    content: '翻过两座山头，穿过一片枯死的松林，少女和狐狸来到了一座隐藏在群峰之间的湖泊前。


      湖水是金色的，像是一整块融化的琥珀。湖面平静无波，倒映着四周的雪山和蓝天。空气里弥漫着一种说不清的甜香，像是桂花的味道。


      狐狸在湖边停下，金色眼睛直直地盯着湖心。'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 是这里吗？
    character: 金色
    parenthetical: null
    confidence: 0.5
  - type: action
    content: '少女问。


      狐狸没有回答。她正要再问，忽然看见湖心冒起了一串气泡。气泡越来越大，越来越多，整片湖水开始像烧开的水一样翻滚。


      少女下意识后退了一步。


      一只巨大的爪子从湖水中伸出——鳞片是深蓝色的，每一片都有磨盘那么大。爪子搭在岸边，地面跟着震颤了一下。


      接着，一颗巨大的头颅缓缓浮出水面。


      龙的双眼是琥珀色的，和狐狸的眼睛一模一样。它看着少女，少女也看着它。'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 你终于来了。
    character: 金色
    parenthetical: null
    confidence: 0.3
  - type: action
    content: '龙的声音不是从耳朵听到的，而像是直接在她脑海里响起的。


      少女张了张嘴，想说话，却发现自己的声音在颤抖：'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 你……你知道我要来？
    character: 羊皮纸
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 龙没有回答她的问题。它的目光落在她手中的羊皮纸上，那四个字正燃烧般地发着光。
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 你是第三百二十七个来到这里的。
    character: 羊皮纸
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 龙说，
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 希望你是最后一个。
    character: 羊皮纸
    parenthetical: null
    confidence: 0.5
  - type: action
    content: '少女紧紧握着羊皮纸，突然想起了爷爷昨晚说的那句话——


      你心里有没有那条你想成为的龙。


      她深吸一口气，迎上了龙的目光：'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 我不是来找龙的。
    character: 那条
    parenthetical: null
    confidence: 0.5
  - type: dialogue
    content: 是吗？
    character: 成为
    parenthetical: null
    confidence: 0.5
  - type: action
    content: '龙的眼睛里闪过一丝意外。


      少女说：'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 我是来成为龙的。
    character: 金色
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 湖水上方的金光大盛，整个世界都被染成了金色。
    character: null
    parenthetical: null
    confidence: 1.0
