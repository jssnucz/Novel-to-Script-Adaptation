    content: 萧炎先是震惊，随即涌上怒意：
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 我三年苦修，全给你做了嫁衣？！
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 药老不紧不慢地说：
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 嘿嘿，作为补偿，老夫可以教你炼药术。这天地间，炼药师的身份可比斗者尊贵得多。
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: dialogue
    content: 炼药师？
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 萧炎愣了愣，
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 你是说……那些能炼出丹药，让人脱胎换骨的炼药师？
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: dialogue
    content: 正是。
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 药老抚须一笑，
    character: null
    parenthetical: null
    confidence: 1.0
