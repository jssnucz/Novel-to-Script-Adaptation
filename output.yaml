  lines:
  - type: action
    content: '夜已深沉，月光如水。


      萧炎独自坐在院落中，手中握着一枚古朴的戒指。戒指在月光下泛着幽幽的光泽，这是他母亲留给他的唯一遗物。


      忽然，戒指轻颤了一下。'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 小家伙，你倒是沉得住气。
    character: 苍老
    parenthetical: null
    confidence: 0.75
  - type: action
    content: '一道苍老的声音从戒指中传出。


      萧炎瞳孔骤缩，猛地站起身：'
