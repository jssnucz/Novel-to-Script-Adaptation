  lines:
  - type: action
    content: '三天后，迦南学院考核大殿。


      数百名年轻修炼者齐聚一堂，气氛压抑得让人喘不过气。萧炎站在人群中央，感受着四面八方投来的目光——有好奇，有轻蔑，更多的是漠不关心。'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 下一个，萧炎！
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 考核官的声音在大殿中回荡。
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 终于轮到我了。
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: action
    content: '萧炎深吸一口气，走向考核台。


      考核台上放着一块测魔石碑，碑面光滑如镜。萧炎将手掌按在碑面上，体内斗气如潮水般涌出。石碑瞬间亮起刺目的光芒——三段斗之气！'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 三段斗之气……
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 考核官皱了皱眉，
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 修为平平，下一个。
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 萧炎默默退下，耳边传来细微的窃窃私语。
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 听说他是萧家那个废物？
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: dialogue
    content: 三年前还是天才，现在连四段都没突破……
    character: 纳兰嫣然
    parenthetical: null
    confidence: 0.5
  - type: dialogue
    content: 啧啧，这落差，换我早就不练了。
    character: 纳兰嫣然
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 纳兰嫣然站在人群中，望着萧炎的背影，手指微微攥紧。
    character: null
    parenthetical: null
    confidence: 1.0
