  lines:
  - type: action
    content: '测试山巅，云海翻腾。


      萧炎盘膝坐在青石之上，双目紧闭，周身天地能量缓缓汇聚而来。'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 三年了……终于摸到了斗者门槛。
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 他低声自语，语气中带着说不清的复杂。
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 萧炎哥哥！
    character: 纳兰嫣然
    parenthetical: null
    confidence: 0.5
  - type: action
    content: '远处传来一声清脆的呼喊。


      纳兰嫣然踏空而来，白衣飘飘，落在萧炎面前。她神色清冷，眼中却有一丝不易察觉的关切：'
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 明日就是迦南学院的考核，你准备好了吗？
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 萧炎睁开眼睛，苦笑道：
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 准备？我准备了整整三年。
    character: 纳兰嫣然
    parenthetical: null
    confidence: 0.5
  - type: dialogue
    content: 那就好。
    character: 纳兰嫣然
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 纳兰嫣然转身望向云海，
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 这云岚宗的风景，怕是最后一次看了。
    character: 纳兰嫣然
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 萧炎站起身，拍了拍衣袍上的尘土：
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 走吧，下山。
    character: 萧炎
    parenthetical: null
    confidence: 0.5
  - type: action
    content: 两人并肩而行，谁也没有再说话。山路两旁的枫叶红得像火，山风卷起落叶，在他们身后飘零。
    character: null
    parenthetical: null
    confidence: 1.0
