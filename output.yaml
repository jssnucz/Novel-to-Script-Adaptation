    content: 戒指中飘出一缕白烟，缓缓凝聚成一个透明老者的身影。老者负手而立，面带微笑：
    character: null
    parenthetical: null
    confidence: 1.0
  - type: dialogue
    content: 老夫名号药老，魂居此戒已千年。你这三年斗气倒退，是你这戒指在吸你的斗气温养老夫。
    character: 萧炎
    parenthetical: null
